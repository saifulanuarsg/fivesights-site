<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- fivesights mark, redrawn compactly from logo-v02.svg for use as a
       favicon. Gold centre (Sight) inside the frame, four cosmology
       colours pointing outward. -->
  <rect x="186" y="186" width="652" height="652" rx="112" fill="none" stroke="#000" stroke-width="44"/>
  <rect x="292" y="292" width="440" height="440" rx="88" fill="#fff" stroke="#000" stroke-width="40"/>
  <rect x="396" y="396" width="232" height="232" rx="72" fill="#9C7C1F"/>
  <!-- Oversight, up -->
  <path d="M512 96 690 252 H334 Z" fill="#009500" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
  <!-- Insight, down -->
  <path d="M512 928 334 772 H690 Z" fill="#808080" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
  <!-- Hindsight, left -->
  <path d="M96 512 252 334 V690 Z" fill="#647BD3" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
  <!-- Foresight, right -->
  <path d="M928 512 772 690 V334 Z" fill="#D95353" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
</svg>
